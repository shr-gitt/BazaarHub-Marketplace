<p-toast position="top-right" [life]="3000"></p-toast>
<div class="p-4 max-w-3xl mx-auto">
  <div class="mb-4">
    <h2 class="text-3xl font-bold m-0">My Profile</h2>
    <p class="text-color-secondary mt-1">
      Manage your account and
      {{ role === "VENDOR" ? "business" : "personal" }} information
    </p>
  </div>

  <p-tabView>
    <p-tabPanel header="Account" leftIcon="pi pi-user">
      <div *ngIf="loadingAccount" class="flex justify-content-center py-6">
        <p-progress-spinner
          strokeWidth="4"
          [style]="{ width: '32px', height: '32px' }"
        />
      </div>

      <form
        *ngIf="!loadingAccount"
        [formGroup]="accountForm"
        (ngSubmit)="saveAccount()"
        novalidate
      >
        <p class="font-semibold text-lg mb-3">Personal Details</p>

        <div class="grid">
          <div class="col-12 md:col-6 flex flex-column gap-1">
            <label class="font-medium"
              >First Name <span class="text-red-500">*</span></label
            >
            <input
              pInputText
              formControlName="firstName"
              placeholder="Enter first name"
              [class.ng-invalid]="
                af['firstName'].invalid && af['firstName'].touched
              "
              [class.ng-dirty]="af['firstName'].touched"
            />
            <small
              class="text-red-500"
              *ngIf="af['firstName'].invalid && af['firstName'].touched"
            >
              First name is required.
            </small>
          </div>
          <div class="col-12 md:col-6 flex flex-column gap-1">
            <label class="font-medium"
              >Last Name <span class="text-red-500">*</span></label
            >
            <input
              pInputText
              formControlName="lastName"
              placeholder="Enter last name"
              [class.ng-invalid]="
                af['lastName'].invalid && af['lastName'].touched
              "
              [class.ng-dirty]="af['lastName'].touched"
            />
            <small
              class="text-red-500"
              *ngIf="af['lastName'].invalid && af['lastName'].touched"
            >
              Last name is required.
            </small>
          </div>
        </div>

        <div class="grid mt-2">
          <div class="col-12 md:col-6 flex flex-column gap-1">
            <label class="font-medium"
              >Email <span class="text-red-500">*</span></label
            >
            <input
              pInputText
              type="email"
              formControlName="email"
              placeholder="name@example.com"
              [class.ng-invalid]="af['email'].invalid && af['email'].touched"
              [class.ng-dirty]="af['email'].touched"
            />
            <small
              class="text-red-500"
              *ngIf="af['email'].invalid && af['email'].touched"
            >
              <span *ngIf="af['email'].errors?.['required']"
                >Email is required.</span
              >
              <span *ngIf="af['email'].errors?.['email']"
                >Enter a valid email.</span
              >
            </small>
          </div>
          <div class="col-12 md:col-6 flex flex-column gap-1">
            <label class="font-medium"
              >Phone <span class="text-red-500">*</span></label
            >
            <input
              pInputText
              formControlName="phoneNumber"
              placeholder="Enter phone number"
              [class.ng-invalid]="
                af['phoneNumber'].invalid && af['phoneNumber'].touched
              "
              [class.ng-dirty]="af['phoneNumber'].touched"
            />
            <small
              class="text-red-500"
              *ngIf="af['phoneNumber'].invalid && af['phoneNumber'].touched"
            >
              Phone number is required.
            </small>
          </div>
        </div>

        <div class="flex flex-column gap-1 mt-2" style="max-width: 300px">
          <label class="font-medium"
            >Gender <span class="text-red-500">*</span></label
          >
          <p-select
            formControlName="gender"
            [options]="genderOptions"
            optionLabel="label"
            optionValue="value"
            styleClass="w-full"
          />
        </div>

        <p-divider />
        <p class="font-semibold text-lg mb-1">
          Change Password
          <span class="text-color-secondary text-sm font-normal"
            >(optional)</span
          >
        </p>

        <div class="flex flex-column gap-1 mt-2" style="max-width: 300px">
          <label class="font-medium">New Password</label>
          <p-password
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="Leave blank to keep current"
            styleClass="w-full"
          />
        </div>

        <div class="mt-4">
          <p-button
            styleClass="w-full mt-4"
            type="submit"
            label="Save Account"
            icon="pi pi-save"
            [loading]="savingAccount"
            [disabled]="savingAccount || accountForm.invalid"
          />
        </div>
      </form>
    </p-tabPanel>

    <p-tabPanel
      [header]="role === 'VENDOR' ? 'Business Profile' : 'Customer Profile'"
      [leftIcon]="role === 'VENDOR' ? 'pi pi-building' : 'pi pi-user'"
    >
      <app-vendor-profile *ngIf="role === 'VENDOR'" [isUpdate]="true" />
      <app-customer-profile-setup
        *ngIf="role === 'CUSTOMER'"
        [isUpdate]="true"
      />
    </p-tabPanel>
  </p-tabView>
</div>
