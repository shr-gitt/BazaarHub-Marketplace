<div class="page-header">
  <div>
    <h2>🔔 Notifications</h2>
    <p class="subtitle">Stay updated with your account activity</p>
  </div>
  <button class="btn btn-outline" (click)="markAllAsRead()">Mark All as Read</button>
</div>

<div class="alert alert-danger" *ngIf="error">{{ error }}</div>

<div class="card" style="max-width:800px;margin:0 auto">
  <div *ngIf="loading" class="loading-overlay"><div class="spinner"></div></div>
  
  <div class="notif-list" *ngIf="!loading">
    <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.isRead">
      <div class="notif-icon">🔔</div>
      <div class="notif-content">
        <div class="notif-title">
          <span>{{ n.title }}</span>
          <span class="badge badge-primary ms-1" *ngIf="!n.isRead">New</span>
        </div>
        <div class="notif-message">{{ n.message }}</div>
        <div class="notif-time">{{ n.createdAt | date:'medium' }}</div>
      </div>
      <button class="btn btn-ghost btn-icon" *ngIf="!n.isRead" (click)="markAsRead(n.id)" title="Mark as read">✓</button>
    </div>

    <div class="empty-state" *ngIf="notifications.length === 0">
      <div class="empty-icon">🔕</div>
      <h4>All caught up!</h4>
      <p>No new notifications right now.</p>
    </div>
  </div>
</div>
