<div class="admin-orders-page">
  <div class="page-header">
    <div>
      <h2>Order Management</h2>
      <p>Manage and monitor all marketplace orders.</p>
    </div>
  </div>

  <p-table
    [value]="orders"
    [loading]="isLoading"
    [paginator]="true"
    [rows]="pageSize"
    [totalRecords]="totalRecords"
    [lazy]="true"
    responsiveLayout="scroll"
    (onPage)="onPageChange($event)"
  >
    <ng-template pTemplate="header">
      <tr>
        <th>Order ID</th>
        <th>User ID</th>
        <th>Products</th>
        <th>Total</th>
        <th>Payment</th>
        <th>Status</th>
        <th>Contact</th>
        <th>Date</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-order>
      <tr>
        <td>
          <span class="order-id">#{{ order.id }}</span>
        </td>

        <td>{{ order.userId }}</td>

        <td>
          <div class="product-list">
            {{ getProductNames(order) }}
          </div>
        </td>

        <td>
          <span class="amount"> Rs. {{ order.totalAmount }} </span>
        </td>

        <td>
          <p-tag [value]="order.paymentStatus" severity="info"></p-tag>
        </td>

        <td>
          <p-tag [value]="order.orderStatus" severity="success"></p-tag>
        </td>

        <td>
          <span class="contact">
            {{ order.contactNumber }}
          </span>
        </td>

        <td>
          <span class="date">
            {{ order.createdAt | date: "mediumDate" }}
          </span>
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
