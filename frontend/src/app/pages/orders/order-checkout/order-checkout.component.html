<h2 class="checkout-title">Checkout</h2>

<div class="grid checkout-grid">
  <div class="col-12 md:col-5 sticky-summary">
    <app-order-summary></app-order-summary>
  </div>

  <div class="col-12 md:col-7 flex flex-column gap-4">
    <p-card styleClass="form-card">
      <ng-template pTemplate="header">
        <div class="card-header">
          <span class="card-header-title">Delivery Details</span>
        </div>
      </ng-template>

      <form [formGroup]="checkoutForm" class="flex flex-column gap-3">
        <div class="flex flex-column">
          <label for="shippingAddress" class="field-label">
            Shipping Address <span class="required-star">*</span>
          </label>
          <textarea
            id="shippingAddress"
            pTextarea
            [fluid]="true"
            rows="3"
            formControlName="shippingAddress"
            style="resize: none"
          ></textarea>
          <small
            class="error-text"
            *ngIf="
              checkoutForm.get('shippingAddress')?.invalid &&
              checkoutForm.get('shippingAddress')?.touched
            "
          >
            <i class="pi pi-exclamation-circle"></i>
            Shipping address is required.
          </small>
        </div>

        <div class="flex flex-column">
          <label for="contactNumber" class="field-label">
            Contact Number <span class="required-star">*</span>
          </label>
          <input
            id="contactNumber"
            pInputText
            [fluid]="true"
            type="text"
            formControlName="contactNumber"
          />

          <small
            class="error-text"
            *ngIf="
              checkoutForm.get('contactNumber')?.errors?.['required'] &&
              checkoutForm.get('contactNumber')?.touched
            "
          >
            <i class="pi pi-exclamation-circle"></i>
            Contact number is required.
          </small>
          <small
            class="error-text"
            *ngIf="
              checkoutForm.get('contactNumber')?.errors?.['pattern'] &&
              checkoutForm.get('contactNumber')?.touched
            "
          >
            <i class="pi pi-exclamation-circle"></i>
            Enter a valid 10-digit number.
          </small>
        </div>

        <div class="flex flex-column">
          <label for="remark" class="field-label">Remarks (Optional)</label>
          <textarea
            id="remark"
            pTextarea
            [fluid]="true"
            rows="3"
            formControlName="remark"
            style="resize: none"
          ></textarea>
        </div>
      </form>
    </p-card>

    <div *ngIf="errorMessage" class="error-banner">
      <i class="pi pi-exclamation-triangle"></i>
      {{ errorMessage }}
    </div>

    <p-button
      label="Place order"
      iconPos="right"
      styleClass="proceed-btn"
      [loading]="isSubmitting"
      [disabled]="isSubmitting"
      (onClick)="placeOrder()"
    />
  </div>
</div>
