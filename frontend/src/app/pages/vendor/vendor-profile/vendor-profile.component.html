<div class="auth-page">
  <p-toast position="top-right" [life]="3000"></p-toast>

  <div class="auth-card register-card">
    <div class="auth-brand">
      <p class="font-semibold text-lg mb-3">Vendor Details</p>
    </div>

    <div *ngIf="loading" class="text-center p-4">
      <span>Loading profile...</span>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      *ngIf="!loading"
      novalidate
    >
      <div class="form-group">
        <label>Business Name <span style="color: red">*</span></label>
        <input
          class="form-control"
          formControlName="shopName"
          [class.is-invalid]="f['shopName'].invalid && f['shopName'].touched"
          placeholder="Enter your shop or business name"
        />
        <span
          class="invalid-feedback"
          *ngIf="f['shopName'].invalid && f['shopName'].touched"
          >Business name is required.</span
        >
      </div>

      <div class="form-group">
        <label>Pan Card No <span style="color: red">*</span></label>
        <input
          class="form-control"
          formControlName="panCardNo"
          [class.is-invalid]="f['panCardNo'].invalid && f['panCardNo'].touched"
          placeholder="Enter PAN card number"
        />
        <span
          class="invalid-feedback"
          *ngIf="f['panCardNo'].invalid && f['panCardNo'].touched"
          >PAN card number is required.</span
        >
      </div>

      <div class="form-group">
        <label>Registration No <span style="color: red">*</span></label>
        <input
          class="form-control"
          formControlName="registrationNo"
          [class.is-invalid]="
            f['registrationNo'].invalid && f['registrationNo'].touched
          "
          placeholder="Enter business registration number"
        />
        <span
          class="invalid-feedback"
          *ngIf="f['registrationNo'].invalid && f['registrationNo'].touched"
          >Registration number is required.</span
        >
      </div>

      <app-address [group]="addressForm"></app-address>

      <div class="grid-2">
        <div class="form-group">
          <label>Contact Email <span style="color: red">*</span></label>
          <input
            type="email"
            class="form-control"
            formControlName="businessEmail"
            [class.is-invalid]="
              f['businessEmail'].invalid && f['businessEmail'].touched
            "
            placeholder="business@example.com"
          />
          <span
            class="invalid-feedback"
            *ngIf="f['businessEmail'].invalid && f['businessEmail'].touched"
            >Valid email required.</span
          >
        </div>
        <div class="form-group">
          <label>Contact Phone</label>
          <input
            class="form-control"
            formControlName="businessPhone"
            placeholder="Enter contact phone number"
          />
        </div>
      </div>

      <p-button
        styleClass="w-full mt-4"
        type="submit"
        [disabled]="saving || form.invalid"
      >
        {{ saving ? "Saving..." : "Save Profile" }}
      </p-button>
    </form>
  </div>
</div>
