
<div class="auth-page">
  <div class="auth-card register-card">
    <div class="auth-brand">
      <h1>Vendor Profile</h1>
      <p>Manage your business information</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      *ngIf="!loading"
      novalidate
    >
      <div class="form-group">
        <label>Business Name *</label>
        <input
          class="form-control"
          formControlName="shopName"
          [class.is-invalid]="f['shopName'].invalid && f['shopName'].touched"
        />
        <span
          class="invalid-feedback"
          *ngIf="f['shopName'].invalid && f['shopName'].touched"
          >Required.</span
        >
      </div>

      <div class="form-group">
        <label>Pan Card No *</label>
        <input
          class="form-control"
          formControlName="panCardNo"
          [class.is-invalid]="f['panCardNo'].invalid && f['panCardNo'].touched"
        />
        <span
          class="invalid-feedback"
          *ngIf="f['panCardNo'].invalid && f['panCardNo'].touched"
          >Required.</span
        >
      </div>

      <div class="form-group">
        <label>Registration No *</label>
        <input
          class="form-control"
          formControlName="registrationNo"
          [class.is-invalid]="
            f['registrationNo'].invalid && f['registrationNo'].touched
          "
        />
        <span
          class="invalid-feedback"
          *ngIf="f['registrationNo'].invalid && f['registrationNo'].touched"
          >Required.</span
        >
      </div>

      <app-address [group]="addressForm"></app-address>

      <div class="grid-2">
        <div class="form-group">
          <label>Contact Email *</label>
          <input
            type="email"
            class="form-control"
            formControlName="businessEmail"
            [class.is-invalid]="
              f['businessEmail'].invalid && f['businessEmail'].touched
            "
          />
          <span
            class="invalid-feedback"
            *ngIf="f['businessEmail'].invalid && f['businessEmail'].touched"
            >Valid email required.</span
          >
        </div>
        <div class="form-group">
          <label>Contact Phone</label>
          <input class="form-control" formControlName="businessPhone" />
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-lg mt-4"
        [disabled]="saving"
      >
        {{ saving ? "Saving..." : "💾 Save Profile" }}
      </button>
    </form>
  </div>
</div>
