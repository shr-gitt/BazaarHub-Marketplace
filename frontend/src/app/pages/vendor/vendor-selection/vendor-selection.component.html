<div class="vendor-page">
  <p-toast position="top-right" [life]="3000"></p-toast>

  <div class="vendor-card">
    <div class="header">
      <h1>Welcome back</h1>
      <p>Select a vendor to continue</p>
    </div>

    <div class="loading" *ngIf="loading">Loading vendors...</div>

    <div
      *ngIf="!loading"
      class="flex flex-column gap-2 w-full"
      style="max-width: 500px"
    >
      <p-button
        *ngFor="let vendor of vendors"
        [label]="vendor.shopName"
        [text]="true"
        styleClass="w-full text-left justify-content-start px-3 py-3 border-1 border-200 border-round hover:surface-100"
        (onClick)="selectVendor(vendor)"
      >
        <ng-template pTemplate="content">
          <div class="flex justify-content-between align-items-center w-full">
            <div class="flex align-items-center gap-2">
              <i class="pi pi-shop text-primary"></i>
              <span class="font-medium">{{ vendor.shopName }}</span>
            </div>
            <i class="pi pi-chevron-right text-primary text-sm"></i>
          </div>
        </ng-template>
      </p-button>
    </div>

    <div class="buttons">
      <p-button
        label="+ Create new vendor"
        styleClass="w-full"
        (onClick)="onCreateVendor()"
      />
      <p-button
        label="Logout"
        icon="pi pi-sign-out"
        severity="danger"
        [outlined]="true"
        styleClass="w-full mt-2"
        (onClick)="logout()"
      />
    </div>
  </div>
</div>
