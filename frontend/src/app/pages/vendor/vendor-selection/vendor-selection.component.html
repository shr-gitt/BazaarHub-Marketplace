<div class="vendor-page">
  <div class="header">
    <h1>Welcome back</h1>
    <p>Select a vendor to continue</p>
  </div>

  <div class="error" *ngIf="error">
    {{ error }}
  </div>

  <div class="loading" *ngIf="loading">Loading vendors...</div>

  <div class="vendor-list" *ngIf="!loading && vendors.length">
    <div
      class="vendor-item"
      *ngFor="let vendor of vendors"
      (click)="selectVendor(vendor)"
    >
      <div class="vendor-name">
        {{ vendor.shopName }}
      </div>

      <div class="vendor-action">Select →</div>
    </div>
  </div>

  <div class="empty" *ngIf="!loading && !vendors.length">
    No vendors found. Create your first vendor to continue.
  </div>

  <div class="create" (click)="onCreateVendor()">+ Create new vendor</div>

  <button class="logout-btn" (click)="logout()">Logout</button>
</div>
