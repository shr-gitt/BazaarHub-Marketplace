<div class="auth-page">
  <p-toast position="top-right" [life]="3000"></p-toast>

  <div class="auth-card register-card">
    <div class="auth-brand">
      <h1>Vendor Profile Setup</h1>
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label>Business Name <span style="color: red">*</span></label>
          <input
            class="form-control"
            formControlName="shopName"
            [class.is-invalid]="
              profileForm.get('shopName')?.invalid &&
              profileForm.get('shopName')?.touched
            "
            placeholder="Enter your shop name"
          />
          <span
            class="invalid-feedback"
            *ngIf="
              profileForm.get('shopName')?.invalid &&
              profileForm.get('shopName')?.touched
            "
          >
            Shop name is required.
          </span>
        </div>

        <div class="form-group">
          <label>Business Email <span style="color: red">*</span></label>
          <input
            type="email"
            class="form-control"
            formControlName="businessEmail"
            [class.is-invalid]="
              profileForm.get('businessEmail')?.invalid &&
              profileForm.get('businessEmail')?.touched
            "
            placeholder="business@example.com"
          />
          <span
            class="invalid-feedback"
            *ngIf="
              profileForm.get('businessEmail')?.invalid &&
              profileForm.get('businessEmail')?.touched
            "
          >
            <ng-container
              *ngIf="profileForm.get('businessEmail')?.errors?.['required']"
              >Email is required.</ng-container
            >
            <ng-container
              *ngIf="profileForm.get('businessEmail')?.errors?.['email']"
              >Enter a valid email.</ng-container
            >
          </span>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Business Phone <span style="color: red">*</span></label>
          <input
            class="form-control"
            formControlName="businessPhone"
            [class.is-invalid]="
              profileForm.get('businessPhone')?.invalid &&
              profileForm.get('businessPhone')?.touched
            "
            placeholder="Enter business phone number"
          />
          <span
            class="invalid-feedback"
            *ngIf="
              profileForm.get('businessPhone')?.invalid &&
              profileForm.get('businessPhone')?.touched
            "
          >
            Phone number is required.
          </span>
        </div>

        <div class="form-group">
          <label>PAN Card No <span style="color: red">*</span></label>
          <input
            class="form-control"
            formControlName="panCardNo"
            [class.is-invalid]="
              profileForm.get('panCardNo')?.invalid &&
              profileForm.get('panCardNo')?.touched
            "
            placeholder="Enter PAN card number"
          />
          <span
            class="invalid-feedback"
            *ngIf="
              profileForm.get('panCardNo')?.invalid &&
              profileForm.get('panCardNo')?.touched
            "
          >
            PAN card number is required.
          </span>
        </div>
      </div>

      <div class="form-group">
        <label>Registration No <span style="color: red">*</span></label>
        <input
          class="form-control"
          formControlName="registrationNo"
          [class.is-invalid]="
            profileForm.get('registrationNo')?.invalid &&
            profileForm.get('registrationNo')?.touched
          "
          placeholder="Enter registration number"
        />
        <span
          class="invalid-feedback"
          *ngIf="
            profileForm.get('registrationNo')?.invalid &&
            profileForm.get('registrationNo')?.touched
          "
        >
          Registration number is required.
        </span>
      </div>

      <app-address [group]="addressForm"></app-address>

      <p-button
        styleClass="w-full"
        type="submit"
        icon="pi pi-user-plus"
        [label]="loading ? 'Saving...' : 'Create Vendor Profile'"
        [disabled]="loading || profileForm.invalid"
      >
      </p-button>
    </form>
  </div>
</div>
