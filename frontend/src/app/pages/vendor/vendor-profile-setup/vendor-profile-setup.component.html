<div class="auth-page">
  <div class="auth-card register-card">
    <div class="auth-brand">
      <h1>Vendor Profile</h1>
      <p>Complete your vendor profile</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">
      {{ error }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <div class="form-group">
          <label>Shop Name</label>
          <input class="form-control" formControlName="shopName" />
        </div>

        <div class="form-group">
          <label>Business Email</label>
          <input class="form-control" formControlName="businessEmail" />
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>Business Phone</label>
          <input class="form-control" formControlName="businessPhone" />
        </div>

        <div class="form-group">
          <label>PAN Card No</label>
          <input class="form-control" formControlName="panCardNo" />
        </div>
      </div>

      <div class="form-group">
        <label>Registration No</label>
        <input class="form-control" formControlName="registrationNo" />
      </div>

      <div formGroupName="addressRequestDto">
        <div class="form-grid">
          <div class="form-group">
            <label>Province</label>
            <input class="form-control" formControlName="province" />
          </div>

          <div class="form-group">
            <label>District</label>
            <input class="form-control" formControlName="district" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Municipality</label>
            <input class="form-control" formControlName="municipality" />
          </div>

          <div class="form-group">
            <label>Ward No</label>
            <input
              type="number"
              class="form-control"
              formControlName="wardNo"
            />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Street</label>
            <input class="form-control" formControlName="street" />
          </div>

          <div class="form-group">
            <label>Postal Code</label>
            <input class="form-control" formControlName="postalCode" />
          </div>
        </div>
      </div>

      <button class="btn-primary" type="submit">Create Vendor Profile</button>
    </form>
  </div>
</div>
