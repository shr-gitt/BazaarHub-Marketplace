<div class="card max-w-3xl mx-auto">
  <div class="card-header">
    <h2 class="card-title">My Profile</h2>
  </div>

  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <div class="card-body" *ngIf="!isLoading">
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="firstName"
            [class.is-invalid]="
              profileForm.get('firstName')?.invalid &&
              profileForm.get('firstName')?.touched
            "
          />
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="lastName"
            [class.is-invalid]="
              profileForm.get('lastName')?.invalid &&
              profileForm.get('lastName')?.touched
            "
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email address (Cannot be changed)</label>
        <input
          type="email"
          class="form-control"
          [value]="currentUser?.email"
          disabled
        />
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input
          type="text"
          class="form-control"
          formControlName="phoneNumber"
          [class.is-invalid]="
            profileForm.get('phoneNumber')?.invalid &&
            profileForm.get('phoneNumber')?.touched
          "
        />
      </div>

      <div class="form-group">
        <label class="form-label">Gender</label>
        <select
          class="form-control"
          formControlName="gender"
          [class.is-invalid]="
            profileForm.get('gender')?.invalid &&
            profileForm.get('gender')?.touched
          "
        >
          <option [value]="g" *ngFor="let g of genders">{{ g }}</option>
        </select>
      </div>

      <div class="form-actions mt-4">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="profileForm.invalid || isSaving || profileForm.pristine"
        >
          <span class="material-icons spin" *ngIf="isSaving">autorenew</span>
          {{ isSaving ? "Saving..." : "Save Changes" }}
        </button>
      </div>
    </form>
  </div>
</div>
