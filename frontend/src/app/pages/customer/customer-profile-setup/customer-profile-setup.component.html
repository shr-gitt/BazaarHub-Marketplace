<p-toast position="top-right" [life]="3000"></p-toast>

<div class="auth-page" *ngIf="!isUpdate">
  <div class="auth-card register-card">
    <div class="auth-brand">
      <h1>Customer Profile Setup</h1>
    </div>

    <div *ngIf="loading" class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
      *ngIf="!loading"
    >
      <div class="form-group">
        <label>Profile Image <span style="color: red">*</span></label>
        <div class="avatar-upload">
          <label class="btn btn-outline btn-sm d-flex align-items-center gap-2">
            <i class="pi pi-upload"></i>
            Select Photo
            <input
              type="file"
              accept="image/*"
              hidden
              (change)="onFileSelected($event)"
            />
          </label>
          <div
            *ngIf="
              form.get('profileImage')?.touched &&
              form.get('profileImage')?.hasError('required')
            "
          >
            Profile image is required.
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Date of Birth <span style="color: red">*</span></label>
        <input
          type="date"
          class="form-control"
          formControlName="dateOfBirth"
          [class.is-invalid]="
            f['dateOfBirth'].invalid && f['dateOfBirth'].touched
          "
          [max]="today"
        />
        <span
          class="invalid-feedback"
          *ngIf="f['dateOfBirth'].invalid && f['dateOfBirth'].touched"
          >Date of birth is required.
        </span>
      </div>

      <app-address [group]="addressForm"></app-address>

      <div class="form-group mt-3">
        <label>Preferences <span style="color: red">*</span></label>
        <div class="preference-grid">
          <label
            *ngFor="let cat of categories"
            class="preference-chip"
            [class.selected]="isPreferenceSelected(cat.id)"
          >
            <input
              type="checkbox"
              hidden
              [checked]="isPreferenceSelected(cat.id)"
              (change)="togglePreference(cat.id)"
            />
            {{ cat.label }}
          </label>
        </div>
        <span
          class="invalid-feedback d-block"
          *ngIf="f['preferences'].invalid && f['preferences'].touched"
        >
          Select at least one preference.
        </span>
      </div>

      <p-button
        styleClass="w-full"
        type="submit"
        icon="pi pi-user-plus"
        [label]="saving ? 'Saving...' : 'Create Profile'"
        [disabled]="saving || form.invalid"
      >
      </p-button>
    </form>
  </div>
</div>

<ng-container *ngIf="isUpdate">
  <div *ngIf="loading" class="loading-overlay"><div class="spinner"></div></div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate *ngIf="!loading">
    <div class="form-group">
      <label>Date of Birth <span style="color: red">*</span></label>
      <input
        type="date"
        class="form-control"
        formControlName="dateOfBirth"
        [class.is-invalid]="
          f['dateOfBirth'].invalid && f['dateOfBirth'].touched
        "
        [max]="today"
      />
      <span
        class="invalid-feedback"
        *ngIf="f['dateOfBirth'].invalid && f['dateOfBirth'].touched"
        >Date of birth is required.
      </span>
    </div>

    <app-address [group]="addressForm"></app-address>

    <div class="form-group mt-3">
      <label>Preferences <span style="color: red">*</span></label>
      <div class="preference-grid">
        <label
          *ngFor="let cat of categories"
          class="preference-chip"
          [class.selected]="isPreferenceSelected(cat.id)"
        >
          <input
            type="checkbox"
            hidden
            [checked]="isPreferenceSelected(cat.id)"
            (change)="togglePreference(cat.id)"
          />
          {{ cat.label }}
        </label>
      </div>
      <span
        class="invalid-feedback d-block"
        *ngIf="f['preferences'].invalid && f['preferences'].touched"
      >
        Select at least one preference.
      </span>
    </div>

    <p-button
      styleClass="w-full mt-4"
      type="submit"
      icon="pi pi-save"
      [label]="saving ? 'Saving...' : 'Save Profile'"
      [disabled]="saving || form.invalid"
    >
    </p-button>
  </form>
</ng-container>
