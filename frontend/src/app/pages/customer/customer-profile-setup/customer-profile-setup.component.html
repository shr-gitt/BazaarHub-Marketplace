<div class="auth-page" *ngIf="!isUpdate">
  <div class="auth-card register-card">
    <div class="auth-brand">
      <h1>Customer Profile</h1>
      <p>Complete your customer profile</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>

    <div *ngIf="loading" class="loading-overlay">
      <div class="spinner"></div>
    </div>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      novalidate
      *ngIf="!loading"
    >
      <div class="form-group">
        <label>Profile Image *</label>
        <div class="avatar-upload">
          <div class="avatar-preview">
            <img *ngIf="previewUrl" [src]="previewUrl" alt="Preview" />
            <div *ngIf="!previewUrl" class="avatar-placeholder">📷</div>
          </div>
          <label class="btn btn-outline btn-sm">
            Choose Photo
            <input
              type="file"
              accept="image/*"
              hidden
              (change)="onFileSelected($event)"
            />
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Date of Birth *</label>
        <input
          type="date"
          class="form-control"
          formControlName="dateOfBirth"
          [class.is-invalid]="
            f['dateOfBirth'].invalid && f['dateOfBirth'].touched
          "
        />
        <span
          class="invalid-feedback"
          *ngIf="f['dateOfBirth'].invalid && f['dateOfBirth'].touched"
          >Required.</span
        >
      </div>

      <app-address [group]="addressForm"></app-address>

      <div class="form-group mt-3">
        <label>Preferences *</label>
        <div class="preference-grid">
          <label
            *ngFor="let cat of categories"
            class="preference-chip"
            [class.selected]="isPreferenceSelected(cat.id)"
          >
            <input
              type="checkbox"
              hidden
              [checked]="isPreferenceSelected(cat.id)"
              (change)="togglePreference(cat.id)"
            />
            {{ cat.label }}
          </label>
        </div>
        <span
          class="invalid-feedback d-block"
          *ngIf="f['preferences'].invalid && f['preferences'].touched"
        >
          Select at least one preference.
        </span>
      </div>

      <button class="btn-primary" type="submit" [disabled]="saving">
        {{ saving ? "Saving..." : "Create Profile" }}
      </button>
    </form>
  </div>
</div>

<ng-container *ngIf="isUpdate">
  <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  <div class="alert alert-success" *ngIf="success">{{ success }}</div>

  <div *ngIf="loading" class="loading-overlay"><div class="spinner"></div></div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate *ngIf="!loading">
    <div class="form-group">
      <label>Date of Birth *</label>
      <input
        type="date"
        class="form-control"
        formControlName="dateOfBirth"
        [class.is-invalid]="
          f['dateOfBirth'].invalid && f['dateOfBirth'].touched
        "
      />
      <span
        class="invalid-feedback"
        *ngIf="f['dateOfBirth'].invalid && f['dateOfBirth'].touched"
        >Required.</span
      >
    </div>

    <app-address [group]="addressForm"></app-address>

    <div class="form-group mt-3">
      <label>Preferences *</label>
      <div class="preference-grid">
        <label
          *ngFor="let cat of categories"
          class="preference-chip"
          [class.selected]="isPreferenceSelected(cat.id)"
        >
          <input
            type="checkbox"
            hidden
            [checked]="isPreferenceSelected(cat.id)"
            (change)="togglePreference(cat.id)"
          />
          {{ cat.label }}
        </label>
      </div>
    </div>

    <button
      class="btn btn-primary btn-lg mt-4"
      type="submit"
      [disabled]="saving"
    >
      {{ saving ? "Saving..." : "Save Profile" }}
    </button>
  </form>
</ng-container>
