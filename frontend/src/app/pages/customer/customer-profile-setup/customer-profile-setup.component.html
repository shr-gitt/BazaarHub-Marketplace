<div class="auth-page">
  <div class="auth-card register-card">
    <div class="auth-brand">
      <h1>Customer Profile</h1>
      <p>Complete your customer profile</p>
    </div>

    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>

    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="profileImage">Profile Image</label>
        <input
          id="profileImage"
          type="file"
          class="form-control"
          accept="image/*"
          (change)="onFileSelected($event)"
        />
      </div>

      <div class="form-group">
        <label>Date of Birth</label>
        <input type="date" class="form-control" formControlName="dateOfBirth" />
      </div>

      <div formGroupName="addressRequestDto">
        <div class="form-grid">
          <div class="form-group">
            <label>Province</label>
            <input class="form-control" formControlName="province" />
          </div>

          <div class="form-group">
            <label>District</label>
            <input class="form-control" formControlName="district" />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Municipality</label>
            <input class="form-control" formControlName="municipality" />
          </div>

          <div class="form-group">
            <label>Ward No</label>
            <input
              type="number"
              class="form-control"
              formControlName="wardNo"
            />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Street</label>
            <input class="form-control" formControlName="street" />
          </div>

          <div class="form-group">
            <label>Postal Code</label>
            <input class="form-control" formControlName="postalCode" />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>Preferences</label>
        <div class="role-selector">
          <label class="role-option">
            <input type="checkbox" (change)="onPreferenceChange($event, 1)" />
            Electronics
          </label>

          <label class="role-option">
            <input type="checkbox" (change)="onPreferenceChange($event, 2)" />
            Fashion
          </label>
        </div>
      </div>

      <button class="btn-primary" type="submit">Create Customer Profile</button>
    </form>
  </div>
</div>
