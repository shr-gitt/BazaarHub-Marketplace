<div class="profile-page">
  <div class="page-header">
    <div>
      <h2>My Profile</h2>
      <p class="subtitle">
        Manage your account and
        {{ role === "VENDOR" ? "business" : "personal" }} information
      </p>
    </div>
  </div>

  <div class="tab-bar">
    <button
      class="tab-btn"
      [class.active]="activeTab === 'account'"
      (click)="setTab('account')"
    >
      👤 Account
    </button>
    <button
      class="tab-btn"
      [class.active]="activeTab === 'profile'"
      (click)="setTab('profile')"
    >
      {{ role === "VENDOR" ? "🏢 Business Profile" : "🙋 Customer Profile" }}
    </button>
  </div>

  <ng-container *ngIf="activeTab === 'account'">
    <div class="card">
      <div class="card-body">
        <div *ngIf="loadingAccount" class="loading-overlay">
          <div class="spinner"></div>
        </div>
        <div class="alert alert-danger" *ngIf="accountError">
          {{ accountError }}
        </div>
        <div class="alert alert-success" *ngIf="accountSuccess">
          {{ accountSuccess }}
        </div>

        <form
          [formGroup]="accountForm"
          (ngSubmit)="saveAccount()"
          novalidate
          *ngIf="!loadingAccount"
        >
          <h4 class="section-title">Personal Details</h4>
          <div class="grid-2">
            <div class="form-group">
              <label>First Name *</label>
              <input
                class="form-control"
                formControlName="firstName"
                [class.is-invalid]="
                  af['firstName'].invalid && af['firstName'].touched
                "
              />
              <span
                class="invalid-feedback"
                *ngIf="af['firstName'].invalid && af['firstName'].touched"
                >Required.</span
              >
            </div>
            <div class="form-group">
              <label>Last Name *</label>
              <input
                class="form-control"
                formControlName="lastName"
                [class.is-invalid]="
                  af['lastName'].invalid && af['lastName'].touched
                "
              />
              <span
                class="invalid-feedback"
                *ngIf="af['lastName'].invalid && af['lastName'].touched"
                >Required.</span
              >
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label>Email *</label>
              <input
                type="email"
                class="form-control"
                formControlName="email"
                [class.is-invalid]="af['email'].invalid && af['email'].touched"
              />
              <span
                class="invalid-feedback"
                *ngIf="af['email'].invalid && af['email'].touched"
                >Valid email required.</span
              >
            </div>
            <div class="form-group">
              <label>Phone *</label>
              <input
                class="form-control"
                formControlName="phoneNumber"
                [class.is-invalid]="
                  af['phoneNumber'].invalid && af['phoneNumber'].touched
                "
              />
              <span
                class="invalid-feedback"
                *ngIf="af['phoneNumber'].invalid && af['phoneNumber'].touched"
                >Required.</span
              >
            </div>
          </div>

          <div class="form-group">
            <label>Gender *</label>
            <select class="form-control" formControlName="gender">
              <option value="MALE">Male</option>
              <option value="FEMALE">Female</option>
              <option value="OTHER">Other</option>
            </select>
          </div>

          <hr class="divider" />
          <h4 class="section-title">
            Change Password <span class="optional">(optional)</span>
          </h4>

          <div class="grid-3">
            <div class="form-group">
              <label>Password</label>
              <input
                type="password"
                class="form-control"
                formControlName="password"
              />
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-lg mt-4"
            [disabled]="savingAccount"
          >
            {{ savingAccount ? "Saving..." : "💾 Save Account" }}
          </button>
        </form>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="activeTab === 'profile'">
    <app-vendor-profile
      *ngIf="role === 'VENDOR'"
      [isUpdate]="true"
    ></app-vendor-profile>
    <app-customer-profile-setup
      *ngIf="role === 'CUSTOMER'"
      [isUpdate]="true"
    ></app-customer-profile-setup>
  </ng-container>
</div>
