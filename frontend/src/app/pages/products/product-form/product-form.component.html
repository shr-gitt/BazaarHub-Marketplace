<div class="card max-w-3xl mx-auto">
  <div class="card-header">
    <h2 class="card-title">
      {{ isEditMode ? "Edit Product" : "Add New Product" }}
    </h2>
  </div>

  <div class="card-body">
    <div *ngIf="errorMessage" class="alert alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label">Product Name</label>
        <input
          type="text"
          class="form-control"
          formControlName="name"
          [class.is-invalid]="
            productForm.get('name')?.invalid && productForm.get('name')?.touched
          "
        />
        <div
          class="invalid-feedback"
          *ngIf="
            productForm.get('name')?.hasError('required') &&
            productForm.get('name')?.touched
          "
        >
          Product name is required.
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Price (NPR)</label>
          <input
            type="number"
            class="form-control"
            formControlName="price"
            min="0"
            step="0.01"
            [class.is-invalid]="
              productForm.get('price')?.invalid &&
              productForm.get('price')?.touched
            "
          />
          <div
            class="invalid-feedback"
            *ngIf="
              productForm.get('price')?.hasError('min') &&
              productForm.get('price')?.touched
            "
          >
            Price cannot be negative.
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Discount Price (Optional)</label>
          <input
            type="number"
            class="form-control"
            formControlName="discountPrice"
            min="0"
            step="0.01"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select
            class="form-control"
            formControlName="categoryId"
            [class.is-invalid]="
              productForm.get('categoryId')?.invalid &&
              productForm.get('categoryId')?.touched
            "
          >
            <option value="" disabled>Select Category</option>
            <option *ngFor="let cat of categories" [value]="cat.id">
              {{ cat.name }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Stock Quantity</label>
          <input
            type="number"
            class="form-control"
            formControlName="stockQuantity"
            min="0"
            [class.is-invalid]="
              productForm.get('stockQuantity')?.invalid &&
              productForm.get('stockQuantity')?.touched
            "
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Product Image</label>
        <input
          type="file"
          class="form-control"
          (change)="onFileSelect($event)"
          accept="image/jpeg, image/png, image/webp"
          [class.is-invalid]="
            !selectedFile && !isEditMode && productForm.touched
          "
        />
        <div class="text-sm text-secondary mt-1" *ngIf="isEditMode">
          Leave blank to keep existing image.
        </div>
        <div
          class="invalid-feedback"
          *ngIf="!selectedFile && !isEditMode && productForm.touched"
        >
          Image is required for new products.
        </div>

        <div class="mt-3" *ngIf="imagePreview">
          <img
            [src]="imagePreview"
            alt="Preview"
            style="
              max-height: 200px;
              border-radius: var(--radius-md);
              border: 1px solid var(--border-color);
            "
          />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea
          class="form-control"
          formControlName="description"
          rows="5"
          [class.is-invalid]="
            productForm.get('description')?.invalid &&
            productForm.get('description')?.touched
          "
        ></textarea>
      </div>

      <div class="form-actions mt-4">
        <a routerLink="/vendor/products" class="btn btn-secondary">Cancel</a>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="
            productForm.invalid || (!selectedFile && !isEditMode) || isSaving
          "
        >
          <span class="material-icons spin" *ngIf="isSaving">autorenew</span>
          {{
            isSaving
              ? "Saving..."
              : isEditMode
                ? "Update Product"
                : "Create Product"
          }}
        </button>
      </div>
    </form>
  </div>
</div>
