<div class="page-header">
  <div>
    <h2>{{ isEdit ? '✏️ Edit Category' : '+ Add Category' }}</h2>
  </div>
  <a routerLink="/categories" class="btn btn-ghost">← Back</a>
</div>

<div class="card" style="max-width:500px">
  <div class="card-body">
    <div class="alert alert-danger"  *ngIf="error">{{ error }}</div>
    <div class="alert alert-success" *ngIf="success">{{ success }}</div>
    <div *ngIf="loading" class="loading-overlay"><div class="spinner"></div></div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!loading" novalidate>
      <div class="form-group">
        <label>Category Name *</label>
        <input type="text" class="form-control" formControlName="name"
          [class.is-invalid]="f['name'].invalid && f['name'].touched" placeholder="e.g. Electronics">
        <span class="invalid-feedback" *ngIf="f['name'].invalid && f['name'].touched">Required (min 2 chars).</span>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea class="form-control" formControlName="description" placeholder="Optional description..."></textarea>
      </div>
      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="saving">
          {{ saving ? 'Saving...' : (isEdit ? '💾 Update' : '+ Create') }}
        </button>
        <a routerLink="/categories" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
