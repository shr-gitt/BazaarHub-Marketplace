<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-container" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="close.emit()">
      <span class="material-icons">close</span>
    </button>

    <div class="modal-header">
      <div class="tabs">
        <button [class.active]="mode === 'LOGIN'" (click)="toggleMode('LOGIN')">
          Login
        </button>
        <button
          [class.active]="mode === 'REGISTER'"
          (click)="toggleMode('REGISTER')"
        >
          Sign Up
        </button>
      </div>
    </div>

    <div class="modal-body">
      <!-- LOGIN FORM -->
      <div *ngIf="mode === 'LOGIN'" class="auth-form">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please enter your details to sign in.</p>

        <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              formControlName="email"
              placeholder="name@example.com"
            />
            <div
              class="error-msg"
              *ngIf="
                loginForm.get('email')?.touched &&
                loginForm.get('email')?.invalid
              "
            >
              Valid email is required.
            </div>
          </div>

          <div class="form-group">
            <label>Password</label>
            <div class="password-input">
              <input
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="••••••••"
              />
              <button
                type="button"
                class="toggle-pwd"
                (click)="showPassword = !showPassword"
              >
                <span class="material-icons">{{
                  showPassword ? "visibility_off" : "visibility"
                }}</span>
              </button>
            </div>
            <div
              class="error-msg"
              *ngIf="
                loginForm.get('password')?.touched &&
                loginForm.get('password')?.invalid
              "
            >
              Password is required (min 8 chars).
            </div>
          </div>

          <div class="alert error" *ngIf="error">{{ error }}</div>

          <button
            type="submit"
            class="btn btn-primary btn-block"
            [disabled]="loading"
          >
            {{ loading ? "Signing in..." : "Sign In" }}
          </button>
        </form>
      </div>

      <!-- REGISTER FORM -->
      <div *ngIf="mode === 'REGISTER'" class="auth-form">
        <h2>Create Account</h2>
        <p class="subtitle">Join BazaarHub today.</p>

        <form [formGroup]="registerForm" (ngSubmit)="onRegister()">
          <div class="form-row">
            <div class="form-group">
              <label>First Name</label>
              <input
                type="text"
                formControlName="firstName"
                placeholder="John"
              />
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" formControlName="lastName" placeholder="Doe" />
            </div>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input
              type="email"
              formControlName="email"
              placeholder="name@example.com"
            />
          </div>

          <div class="form-group">
            <label>Phone Number</label>
            <input
              type="text"
              formControlName="phoneNumber"
              placeholder="98XXXXXXXX"
            />
          </div>

          <div class="form-group">
            <label>I want to be a</label>
            <select formControlName="role" class="custom-select">
              <option value="CUSTOMER">Customer</option>
              <option value="VENDOR">Vendor (Seller)</option>
            </select>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input
              type="password"
              formControlName="password"
              placeholder="••••••••"
            />
          </div>

          <div class="alert error" *ngIf="error">{{ error }}</div>
          <div class="alert success" *ngIf="success">{{ success }}</div>

          <button
            type="submit"
            class="btn btn-primary btn-block"
            [disabled]="loading"
          >
            {{ loading ? "Creating account..." : "Sign Up" }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
