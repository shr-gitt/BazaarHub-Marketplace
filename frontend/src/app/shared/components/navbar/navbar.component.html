<nav class="navbar">
  <div class="navbar-left">
    <span class="page-title"></span>
  </div>

  <div class="navbar-right">
    <!-- Notification Bell -->
    <a routerLink="/notifications" class="notif-btn" *ngIf="true">
      <span class="bell-icon">🔔</span>
      <span class="badge-dot" *ngIf="unreadCount > 0">{{
        unreadCount > 99 ? "99+" : unreadCount
      }}</span>
    </a>

    <!-- User Dropdown Trigger -->
    <div class="user-chip">
      <div class="chip-avatar">{{ userId }}</div>
      <div class="chip-info">
        <span class="chip-role">{{ role }}</span>
      </div>
    </div>
  </div>
</nav>
