<div *ngIf="addressGroup" [formGroup]="addressGroup">
  <div class="grid-3">
    <div class="form-group">
      <label>Province <span style="color: red">*</span></label>
      <select class="form-control" formControlName="province">
        <option value="">Select</option>
        <option *ngFor="let p of provinces" [value]="p.value">
          {{ p.label }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>District <span style="color: red">*</span></label>
      <select class="form-control" formControlName="district">
        <option value="">Select</option>
        <option *ngFor="let d of districts" [value]="d.value">
          {{ d.label }}
        </option>
      </select>
    </div>
    <div class="form-group">
      <label>Municipality <span style="color: red">*</span></label>
      <select class="form-control" formControlName="municipality">
        <option value="">Select</option>
        <option *ngFor="let m of municipalities" [value]="m.value">
          {{ m.label }}
        </option>
      </select>
    </div>
  </div>
  <div class="grid-3">
    <div class="form-group">
      <label>Ward No <span style="color: red">*</span></label>
      <input
        type="number"
        class="form-control"
        formControlName="wardNo"
        min="1"
      />
    </div>
    <div class="form-group">
      <label>Street <span style="color: red">*</span></label>
      <input class="form-control" formControlName="street" />
    </div>
    <div class="form-group">
      <label>Postal Code <span style="color: red">*</span></label>
      <input class="form-control" formControlName="postalCode" />
    </div>
  </div>
</div>
