<aside class="sidebar" [class.collapsed]="collapsed">
  <div class="sidebar-brand">
    <span class="brand-text" *ngIf="!collapsed">BazaarHub</span>
    <button class="collapse-btn" (click)="toggleCollapse()">
      {{ collapsed ? "→" : "←" }}
    </button>
  </div>

  <nav class="sidebar-nav">
    <a
      *ngFor="let item of filteredNav"
      [routerLink]="
        item.route === '/vendor/products' ? [item.route, vendorId] : item.route
      "
      routerLinkActive="active"
      class="nav-item"
      [title]="collapsed ? item.label : ''"
      tooltipPosition="right"
    >
      <i [class]="'pi ' + item.icon + ' nav-icon'"></i>
      <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
    </a>
    <a
      *ngIf="showCreateAdmin"
      routerLink="internal/admin/create"
      routerLinkActive="active"
      class="nav-item"
    >
      <i class="pi pi-user-plus nav-icon"></i>
      <span class="nav-label" *ngIf="!collapsed">Create Admin</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <button
      pButton
      type="button"
      class="logout-btn"
      icon="pi pi-sign-out"
      [label]="collapsed ? '' : 'Logout'"
      (click)="logout()"
    ></button>
  </div>
</aside>
