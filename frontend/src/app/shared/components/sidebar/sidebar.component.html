<aside class="sidebar" [class.collapsed]="collapsed">
  <!-- Brand -->
  <div class="sidebar-brand">
    <i class="pi pi-shopping-bag brand-icon"></i>
    <span class="brand-text" *ngIf="!collapsed">BazaarHub</span>
    <button class="collapse-btn" (click)="toggleCollapse()">
      {{ collapsed ? "→" : "←" }}
    </button>
  </div>

  <!-- Navigation -->
  <nav class="sidebar-nav">
    <a
      *ngFor="let item of filteredNav"
      [routerLink]="
        item.route === '/vendor/products' ? [item.route, vendorId] : item.route
      "
      routerLinkActive="active"
      class="nav-item"
      [title]="collapsed ? item.label : ''"
      tooltipPosition="right"
    >
      <i [class]="'pi ' + item.icon + ' nav-icon'"></i>
      <span class="nav-label" *ngIf="!collapsed">{{ item.label }}</span>
    </a>
  </nav>

  <!-- Logout -->
  <div class="sidebar-footer">
    <button class="nav-item logout-btn" (click)="logout()">
      <i class="pi pi-sign-out nav-icon"></i>
      <span class="nav-label" *ngIf="!collapsed">Logout</span>
    </button>
  </div>
</aside>
